<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livros</title>
    <link rel="stylesheet" href="assets/css/adm.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/projeto.css">
</head>
<body>
<header>
    <div class="topo">
        <h1>booklist</h1>
    </div>

    <nav class="navbar">
        <a href="inicio.html">Início</a>
        <a href="index.html">sair</a>

    </nav>
</header>
<div class="lista">
<table id="livros-table" border="1">
  <thead>
    <tr>
      <th colspan="5"><h1>Gerenciar Livros</h1></th>
    </tr>
    <tr>
      <th>Título</th>
      <th>Autor</th>
      <th>Gênero</th>
      <th>Status</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody id="GetBooks"></tbody>
</table>
</div>


<div class="container">
  <h2>Adicionar Novo Livro</h2>
  <input type="text" id="titulo" placeholder="Título" required>
  <input type="text" id="autor" placeholder="Autor" required>
  <input type="text" id="genero" placeholder="Gênero" required>
  <button onclick="CriarLivro()">Adicionar Livro</button>
</div>



<script src="js/livro.js" defer></script>
</body>
</html>
